# Foot terminal configuration styled with Cursor Design Principles

[main]
font=JetBrains Mono:size=13
pad=16x16

[colors]
# Background: Canvas Soft (#fafaf7)
background=fafaf7
# Foreground: Body text (#5a5852)
foreground=5a5852

# Regular colors
# Selection/Accent: Cursor Orange (#f54e00)
regular0=26251e  # black (Ink)
regular1=cf2d56  # red (Error)
regular2=1f8a65  # green (Success)
regular3=c08532  # yellow (Timeline Done)
regular4=9fbbe0  # blue (Timeline Read)
regular5=c0a8dd  # magenta (Timeline Edit)
regular6=9fc9a2  # cyan (Timeline Grep)
regular7=f7f7f4  # white (Canvas)

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
