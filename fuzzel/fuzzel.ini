# Fuzzel configuration styled with Cursor Design Principles

[main]
# Inter as the open-source substitute for CursorGothic
font=Inter:weight=400:size=14
icon-theme=Papirus-Dark
icons-enabled=yes
lines=10
width=30

[colors]
# Background: Surface Card (#ffffff)
background=ffffffff
# Text: Ink (#26251e)
text=26251eff
# Match: Cursor Orange (#f54e00)
match=f54e00ff
# Selection: Canvas Soft (#fafaf7)
selection=fafaf7ff
# Selection Text: Ink (#26251e)
selection-text=26251eff
# Selection Match: Cursor Orange (#f54e00)
selection-match=f54e00ff
# Border: Hairline (#e6e5e0)
border=e6e5e0ff

[border]
width=1
radius=12
